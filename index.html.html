<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPRINTER HRD Video Interview</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f6fb;color:#0f172a}
.wrap{max-width:1050px;margin:0 auto;padding:24px}.card{background:#fff;border-radius:24px;padding:30px;box-shadow:0 12px 40px rgba(15,23,42,.08)}
.brand{font-weight:800;color:#2563eb;letter-spacing:.4px}.title{font-size:30px;margin:8px 0}.sub{color:#64748b;margin-bottom:24px}
.badge{display:inline-block;padding:8px 12px;border-radius:999px;background:#eff6ff;color:#2563eb;font-weight:700;margin-bottom:16px}
.videoBox{background:#111827;border-radius:20px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.msg{margin:16px 0;padding:14px;border-radius:12px;background:#f8fafc;color:#475569;font-weight:600}
.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:800;cursor:pointer;font-size:15px}
.primary{background:#2563eb;color:#fff}.light{background:#eaf0f8;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}
.btn:disabled{opacity:.5;cursor:not-allowed}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:7px}
#debug{font-family:monospace;font-size:12px;white-space:pre-wrap;margin-top:12px;color:#64748b}
@media(max-width:650px){.wrap{padding:10px}.card{padding:18px;border-radius:18px}.title{font-size:24px}.actions .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="brand">SPRINTER HRD</div>
  <h1 class="title">Video Interview</h1>
  <div class="sub">Tes V9 — Kamera & Mikrofon HTTPS</div>
  <div class="badge">PERTANYAAN 1 DARI 1</div>
  <div class="videoBox"><video id="preview" autoplay playsinline muted></video></div>
  <div class="msg" id="status">Klik <b>Aktifkan Kamera & Mikrofon</b>. Browser akan meminta izin Camera dan Microphone.</div>
  <div class="actions">
    <button class="btn light" id="enableBtn">📹 Aktifkan Kamera & Mikrofon</button>
    <button class="btn primary" id="recordBtn" disabled><span class="dot"></span>Mulai Rekam</button>
    <button class="btn danger" id="stopBtn" disabled>■ Stop Rekam</button>
  </div>
  <div id="debug"></div>
</div></div>
<script>
let stream=null, recorder=null, chunks=[];
const v=document.getElementById('preview'), st=document.getElementById('status');
const eb=document.getElementById('enableBtn'), rb=document.getElementById('recordBtn'), sb=document.getElementById('stopBtn');
function status(t){st.innerHTML=t}
function debug(t){document.getElementById('debug').textContent=t||''}

async function enableMedia(){
  try{
    if(!window.isSecureContext) throw new Error('Halaman bukan Secure Context (HTTPS).');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Browser tidak mendukung getUserMedia.');
    status('Meminta izin kamera dan mikrofon…');
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    v.srcObject=stream;
    await v.play();
    rb.disabled=false;
    eb.textContent='✓ Kamera & Mikrofon Aktif';
    status('✅ <b>Kamera dan mikrofon berhasil aktif.</b> Wajah Anda seharusnya sudah terlihat.');
    const tracks=stream.getTracks().map(x=>x.kind+': '+x.label+' ['+x.readyState+']').join('\n');
    debug(tracks);
  }catch(e){
    status('❌ <b>Kamera/mikrofon belum dapat diakses.</b> Pastikan halaman dibuka langsung melalui HTTPS, lalu izinkan Camera dan Microphone.');
    debug((e.name||'Error')+': '+(e.message||e));
  }
}

function bestMime(){
  const opts=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return opts.find(x=>window.MediaRecorder && MediaRecorder.isTypeSupported(x))||'';
}
function startRecord(){
  if(!stream) return;
  chunks=[];
  const mime=bestMime();
  recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});
    status('✅ Tes rekaman berhasil. Ukuran video: <b>'+Math.round(blob.size/1024)+' KB</b>. Tahap berikutnya video akan dikirim ke Google Drive.');
    rb.disabled=false; sb.disabled=true;
  };
  recorder.start(1000); rb.disabled=true; sb.disabled=false;
  status('🔴 <b>Sedang merekam…</b> Silakan bicara untuk mengetes mikrofon.');
}
function stopRecord(){if(recorder&&recorder.state!=='inactive')recorder.stop()}
eb.onclick=enableMedia; rb.onclick=startRecord; sb.onclick=stopRecord;
window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script>
</body>
</html>
